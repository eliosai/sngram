# One TOML shape across every manifest and config in the tree
include = [ "**/*.toml" ]
exclude = [ "target/**", "fuzz/target/**", "crates/ebpf/target/**" ]

[formatting]
align_entries = false
array_auto_collapse = false
compact_arrays = false
indent_string = "    "
reorder_keys = false
column_width = 100
