# Every file level check this repository runs, in one place, so a local commit and the gate agree
# `just lint` runs this whole set and the ci workflow runs `just lint`
default_install_hook_types = [ "pre-commit", "commit-msg", "pre-push" ]

[[repos]]
repo = "builtin"
hooks = [
    { id = "check-toml", stages = [
        "pre-commit",
    ] },
    { id = "check-yaml", stages = [
        "pre-commit",
    ] },
    { id = "check-merge-conflict", stages = [
        "pre-commit",
    ] },
    { id = "check-symlinks", stages = [
        "pre-commit",
    ] },
    { id = "destroyed-symlinks", stages = [
        "pre-commit",
    ] },
    { id = "detect-private-key", stages = [
        "pre-commit",
    ] },
    { id = "mixed-line-ending", stages = [
        "pre-commit",
    ] },
    { id = "check-added-large-files", stages = [
        "pre-commit",
    ], args = [
        "--maxkb=512",
    ] },
    # A Rust inner attribute opens with `#!`, which the shebang check reads as an interpreter line
    { id = "check-shebang-scripts-are-executable", stages = [
        "pre-commit",
    ], exclude = "\\.rs$" },
    { id = "end-of-file-fixer", stages = [
        "pre-commit",
    ], exclude = "^(\\.agents/skills/|\\.claude/skills$|CHANGELOG\\.md$|train/bins/)" },
    { id = "trailing-whitespace", stages = [
        "pre-commit",
    ], exclude = "^(\\.agents/skills/|CHANGELOG\\.md$|train/bins/)" },
]

# A subject git-cliff cannot parse releases nothing and reaches no changelog, so the message is checked first
[[repos]]
repo = "https://github.com/crate-ci/committed"
rev = "v1.1.11"
hooks = [ { id = "committed-src", stages = [ "commit-msg" ] } ]

[[repos]]
repo = "https://github.com/crate-ci/typos"
rev = "v1.50.1"
hooks = [ { id = "typos-src", stages = [ "pre-commit" ] } ]

[[repos]]
repo = "https://github.com/ComPWA/taplo-pre-commit"
rev = "v0.9.3"
hooks = [ { id = "taplo-format", stages = [ "pre-commit" ] } ]

[[repos]]
repo = "https://github.com/gitleaks/gitleaks"
rev = "v8.30.1"
hooks = [ { id = "gitleaks", stages = [ "pre-commit" ] } ]

# actionlint reads workflow correctness and shellchecks every run block, zizmor reads workflow security
[[repos]]
repo = "https://github.com/rhysd/actionlint"
rev = "v1.7.12"
hooks = [ { id = "actionlint", stages = [ "pre-commit" ] } ]

[[repos]]
repo = "https://github.com/zizmorcore/zizmor-pre-commit"
rev = "v1.30.0"
hooks = [ { id = "zizmor", stages = [ "pre-commit" ] } ]

# The formatter rewrites rather than reports, so a format slip can never reach the gate
[[repos]]
repo = "local"
hooks = [
    { id = "cargo-fmt", name = "cargo fmt", language = "system", entry = "cargo fmt --all --", pass_filenames = false, files = "\\.rs$", stages = [
        "pre-commit",
    ] },
    { id = "agent-layout", name = "agent layout", language = "system", entry = "bash .github/scripts/check-agent-layout.sh", pass_filenames = false, stages = [
        "pre-commit",
    ] },
    { id = "doc-scan", name = "no skipped doc examples", language = "system", entry = "bash scripts/doc-scan.sh", pass_filenames = false, stages = [
        "pre-commit",
    ] },
    { id = "layout-scan", name = "plain visibility and module layout", language = "system", entry = "bash scripts/layout-scan.sh", pass_filenames = false, stages = [
        "pre-commit",
    ] },
    { id = "just-check", name = "just check", language = "system", entry = "just check", pass_filenames = false, stages = [
        "pre-push",
    ] },
    { id = "just-test", name = "just test", language = "system", entry = "just test", pass_filenames = false, stages = [
        "pre-push",
    ] },
]
