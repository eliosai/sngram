default_install_hook_types = ["pre-commit", "pre-push"]

[[repos]]
repo = "builtin"
hooks = [
  { id = "check-toml", stages = ["pre-commit"] },
  { id = "check-json", stages = ["pre-commit"] },
  { id = "check-yaml", stages = ["pre-commit"] },
  { id = "check-merge-conflict", stages = ["pre-commit"] },
  { id = "check-symlinks", stages = ["pre-commit"] },
  { id = "end-of-file-fixer", stages = ["pre-commit"], exclude = "^\\.agents/skills/" },
  { id = "trailing-whitespace", stages = ["pre-commit"], exclude = "^\\.agents/skills/" },
]

[[repos]]
repo = "local"
hooks = [
  {
    id = "just-check",
    name = "just check",
    language = "system",
    entry = "just check",
    pass_filenames = false,
    stages = ["pre-commit"],
  },
  {
    id = "just-test",
    name = "just test",
    language = "system",
    entry = "just test",
    pass_filenames = false,
    stages = ["pre-push"],
  },
]
