[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"

[licenses]
unused-allowed-license = "allow"
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "CC0-1.0",
  "ISC",
  "MIT",
  "MPL-2.0",
  "Unicode-3.0",
  "Unlicense",
  "Zlib",
]

[bans]
multiple-versions = "deny"
skip = [
  { crate = "getrandom", reason = "ahash, jobserver and codspeed each pin a different major" },
  { crate = "hashbrown", reason = "tantivy and indexmap pin different majors" },
  { crate = "windows-sys", reason = "platform crates pin different majors" },
  { crate = "r-efi", reason = "the getrandom majors pull different r-efi majors" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
