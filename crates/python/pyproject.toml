[build-system]
requires = ["maturin>=1.7,<2"]
build-backend = "maturin"

[project]
name = "sngram"
version = "0.8.0"
description = "A sparse ngram library with trained weight tables"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Elios", email = "dev@elios.ai" }]
keywords = ["ngram", "regex", "search", "code-search", "index"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Rust",
    "Programming Language :: Python :: 3",
    "Topic :: Text Processing :: Indexing",
]
dependencies = []

[project.urls]
Repository = "https://github.com/eliosai/sngram"

[tool.uv]
cache-keys = [
    { file = "pyproject.toml" },
    { file = "Cargo.toml" },
    { file = "src/**/*.rs" },
    { file = "../lib/Cargo.toml" },
    { file = "../lib/src/**/*.rs" },
    { file = "../lib/data/weights.bin" },
]

[tool.maturin]
manifest-path = "Cargo.toml"
module-name = "sngram._core"
python-source = "."
features = ["pyo3/extension-module", "weights"]

[dependency-groups]
dev = [
    "pytest>=8",
    "hypothesis>=6",
    "numpy>=2",
    "maturin>=1.7",
    "pyarrow>=17",
    "pytest-codspeed>=4",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "SIM", "RUF", "BLE"]
