[package]
name = "sngram"
version.workspace = true
edition.workspace = true
authors.workspace = true
description = "Sparse n-gram extraction for code search indexing"
license.workspace = true
repository.workspace = true
rust-version.workspace = true
readme = "README.md"
keywords = ["regex", "search", "ngram", "index", "code-search"]
categories = ["text-processing", "algorithms", "data-structures"]
publish = true
exclude = ["data/.checkpoint"]

[features]
default = ["weights"]
# learn adds the bigram counters that train weight tables
learn = []
# weights embeds the trained production weight table
weights = []

[dependencies]
crc32fast = { workspace = true }
regex-syntax = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
regex = { workspace = true }
regex-lite = { workspace = true }

[lints]
workspace = true
