# Nextest profiles for local runs and the pull-request gate

[profile.default]
fail-fast = false

[profile.ci]
fail-fast = false
retries = 0
failure-output = "immediate-final"
slow-timeout = { period = "120s", terminate-after = 2 }

[profile.ci.junit]
path = "junit.xml"

# elgrep's daemon tests rendezvous in real time and lose that race on a loaded runner
[[profile.default.overrides]]
filter = 'package(elgrep) & kind(test)'
retries = 2

[[profile.ci.overrides]]
filter = 'package(elgrep) & kind(test)'
retries = 2
