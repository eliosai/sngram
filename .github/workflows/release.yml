name: release

# a version on main which no tag names yet publishes it; a manual run finishes a release that stopped half way
on:
  push:
    branches: [main]
    paths: [Cargo.toml]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

# .cargo/config.toml builds for the native cpu, and a cached object from another runner's cpu dies on SIGILL
env:
  RUSTFLAGS: "-C target-cpu=x86-64-v2"

jobs:
  plan:
    # a manual run from another branch would release that branch's commit, and a v* tag never moves
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.plan.outputs.version }}
      commit: ${{ steps.plan.outputs.commit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: plan
        run: |
          set -o pipefail
          bash scripts/release.sh plan | tee -a "$GITHUB_OUTPUT"

  # crates.io trusts this workflow file and hands out a token that lives fifteen minutes
  release:
    needs: plan
    if: needs.plan.outputs.version != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
      id-token: write
    env:
      VERSION: ${{ needs.plan.outputs.version }}
      COMMIT: ${{ needs.plan.outputs.commit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.commit }}
          fetch-depth: 0
          persist-credentials: false
      # this job holds the publish token, so it restores no cache another run could have written
      - uses: ./.github/actions/setup-rust
        with:
          tools: git-cliff
          cache: "false"
      - id: crates
        uses: rust-lang/crates-io-auth-action@e919bc7605cde86df457cf5b93c5e103838bd879 # v1.0.5
      # elgrep depends on sngram, so sngram goes first; a rerun skips a crate already published
      - env:
          CARGO_REGISTRY_TOKEN: ${{ steps.crates.outputs.token }}
        run: |
          for crate in sngram elgrep; do
            if curl -fsS -A "eliosai-sngram-release" "https://crates.io/api/v1/crates/$crate/$VERSION" >/dev/null; then
              echo "$crate $VERSION is on crates.io already"
            else
              cargo publish -p "$crate" --locked
            fi
          done
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          bash scripts/release.sh notes "$VERSION" > "$RUNNER_TEMP/notes.md"
          gh release create "v$VERSION" --target "$COMMIT" --title "v$VERSION" --notes-file "$RUNNER_TEMP/notes.md"
