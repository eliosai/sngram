name: release
# Every merge to main may release: the tag, the changelog, and the crates.io publish

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write

jobs:
  release:
    if: ${{ !startsWith(github.event.head_commit.message, 'chore(release)') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ssh-key: ${{ secrets.RELEASE_DEPLOY_KEY }}
          persist-credentials: true
      - uses: ./.github/actions/setup-rust
        with:
          components: clippy, rustfmt
          tools: just,prek,cargo-nextest,cargo-deny,cargo-hack,cargo-semver-checks,git-cliff
      # The gate already passed on the pull request, so this reruns it against the merge commit alone
      - run: just lint
      - run: just check
      - run: just test-ci
      - run: just test-doc
      - run: just doc-check
      - run: just package-check
      - run: just audit
      # OIDC mints a token that lives fifteen minutes, so no long lived credential sits in settings
      - name: crates.io token
        id: crates
        uses: rust-lang/crates-io-auth-action@e919bc7605cde86df457cf5b93c5e103838bd879 # v1.0.5
      - name: release
        run: bash scripts/release.sh
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.crates.outputs.token }}
          GH_TOKEN: ${{ github.token }}
