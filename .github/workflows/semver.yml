name: semver

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: ""

concurrency:
  group: semver-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  semver:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0 # master
        with:
          toolchain: "1.97"
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: just,cargo-semver-checks
      - name: compare the public API against the base branch
        id: compare
        continue-on-error: true
        run: just semver-check ${{ github.event.pull_request.base.sha }}
      - name: require the semver-major label for a breaking change
        if: ${{ steps.compare.outcome == 'failure' && !contains(github.event.pull_request.labels.*.name, 'semver-major') }}
        run: |
          echo "the public API breaks against the base branch; label the pull request semver-major to accept a major release"
          exit 1
