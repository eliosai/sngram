name: bench

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: bench-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # valgrind cannot execute the repo-local native codegen
  RUSTFLAGS: ""

jobs:
  bench:
    if: ${{ github.event_name != 'pull_request' || !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0 # master
        with:
          toolchain: "1.97"
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: just,cargo-codspeed
      - name: build the benches
        run: just bench-build
      - name: run the benches on CodSpeed
        uses: CodSpeedHQ/action@v5
        with:
          mode: simulation
          run: just bench-run

  python:
    if: ${{ github.event_name != 'pull_request' || !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0 # master
        with:
          toolchain: "1.97"
      - uses: Swatinem/rust-cache@v2
      - uses: astral-sh/setup-uv@v5
      - name: build the extension and install the benchmark dependencies
        run: uv sync
        working-directory: crates/python
      - name: run the python benches on CodSpeed
        uses: CodSpeedHQ/action@v5
        with:
          mode: simulation
          working-directory: crates/python
          run: uv run --no-sync pytest benchmarks --codspeed
