name: bench
# Benchmarks only ever run on codspeed hardware
# A shared runner measures its neighbours, so no benchmark belongs on the general fleet

on:
  # A macro minute costs $0.032 after the first 600 a month, so the paths decide whether this runs
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "crates/**"
      - "src/**"
      - "benches/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - ".github/workflows/bench.yml"
      - ".github/actions/setup-rust/action.yml"
  push:
    branches: [main]
    paths:
      - "crates/**"
      - "src/**"
      - "benches/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - ".github/workflows/bench.yml"
      - ".github/actions/setup-rust/action.yml"
  # Walltime holds to a weekly reading, since a shared instrument reads noise the rest of the time
  schedule:
    - cron: "0 5 * * 1"
  workflow_dispatch:

concurrency:
  group: bench-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write

jobs:
  # Instructions and memory, which a simulated cpu reads the same way on any machine
  simulation:
    if: ${{ github.event_name != 'schedule' && (github.event_name != 'pull_request' || !github.event.pull_request.draft) }}
    runs-on: codspeed-macro
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          tools: cargo-codspeed
      - run: cargo codspeed build -m simulation
      - uses: CodSpeedHQ/action@07725aac5ac9e687bba40b9bed8e2bd389a641c8 # v5.2.1
        with:
          mode: simulation
          token: ${{ secrets.CODSPEED_TOKEN }}
          run: cargo codspeed run

  # Walltime reads what a syscall hides from simulation, weekly so it does not spend the budget
  walltime:
    if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    runs-on: codspeed-macro
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          tools: cargo-codspeed
      - run: cargo codspeed build -m walltime
      - uses: CodSpeedHQ/action@07725aac5ac9e687bba40b9bed8e2bd389a641c8 # v5.2.1
        with:
          mode: walltime
          token: ${{ secrets.CODSPEED_TOKEN }}
          run: cargo codspeed run
