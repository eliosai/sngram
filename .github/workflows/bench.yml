name: bench
# Benchmarks only ever run on codspeed hardware
# A shared runner measures its neighbours, so no benchmark belongs on the general fleet

on:
  # A macro minute costs $0.032 after the first 600 a month, so the paths decide whether this runs
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - ".github/workflows/bench.yml"
      - ".github/actions/setup-rust/action.yml"
  push:
    branches: [main]
    paths:
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - ".github/workflows/bench.yml"
      - ".github/actions/setup-rust/action.yml"
  workflow_dispatch:

concurrency:
  group: bench-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# the repository builds for the native cpu, which valgrind cannot run, so every bench builds portable code
env:
  RUSTFLAGS: ""

jobs:
  # Instructions and memory, which a simulated cpu reads the same way on any machine
  simulation:
    if: ${{ github.event_name != 'pull_request' || !github.event.pull_request.draft }}
    runs-on: codspeed-macro
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          tools: just,cargo-codspeed
      - run: just bench-build
      - uses: CodSpeedHQ/action@373d6868929f444bc08d901fd0eb0ad52a8875ea # v5.2.1
        with:
          mode: simulation
          run: just bench-run

  # The python binding's benches, through the same instrument
  python:
    if: ${{ github.event_name != 'pull_request' || !github.event.pull_request.draft }}
    runs-on: codspeed-macro
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
      - run: uv sync --locked
        working-directory: crates/python
      - uses: CodSpeedHQ/action@373d6868929f444bc08d901fd0eb0ad52a8875ea # v5.2.1
        with:
          mode: simulation
          working-directory: crates/python
          run: uv run --no-sync pytest benchmarks --codspeed

  # Walltime reads what a syscall hides from simulation, on a manual run so it does not spend the budget
  walltime:
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: codspeed-macro
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          tools: just,cargo-codspeed
      - run: just bench-build walltime
      - uses: CodSpeedHQ/action@373d6868929f444bc08d901fd0eb0ad52a8875ea # v5.2.1
        with:
          mode: walltime
          run: just bench-run walltime
