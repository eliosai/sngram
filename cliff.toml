# git-cliff writes CHANGELOG.md and the release notes from conventional commits

[changelog]
header = "# Changelog\n\n"
body = """
{% if version %}## {{ version | trim_start_matches(pat="v") }} ({{ timestamp | date(format="%Y-%m-%d") }})
{% else %}## Unreleased
{% endif %}
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim | upper_first }}
{% for commit in commits %}- {% if commit.scope %}{{ commit.scope }}: {% endif %}{{ commit.message | upper_first }}
{% endfor %}
{% endfor %}"""
trim = true

[git]
conventional_commits = true
filter_unconventional = true
split_commits = false
commit_parsers = [
  { message = "^chore\\(release\\)", skip = true },
  { message = "^feat", group = "<!-- 0 -->Features" },
  { message = "^fix", group = "<!-- 1 -->Fixes" },
  { message = "^perf", group = "<!-- 2 -->Performance" },
  { message = "^refactor", group = "<!-- 3 -->Refactoring" },
  { message = "^docs", group = "<!-- 4 -->Documentation" },
  { message = "^(build|ci|chore|test)", group = "<!-- 5 -->Housekeeping" },
]
filter_commits = false
tag_pattern = "v[0-9].*"
sort_commits = "oldest"
